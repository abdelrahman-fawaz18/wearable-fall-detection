<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Wearable fall-detection pipeline</title>
  <desc id="desc">MPU9250 acquisition flows through downsampling, one-second framing, autocorrelation feature extraction, and two SVC outputs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF1F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#12304A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#177E89"/>
    </marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#background)"/>
  <text x="54" y="54" fill="#12304A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Signal-to-decision pipeline</text>
  <text x="54" y="82" fill="#486579" font-family="Arial, sans-serif" font-size="14">One wrist-mounted sensor · one-second frames · two classification tasks</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(45 120)">
      <rect width="190" height="135" rx="16" fill="#12304A"/>
      <circle cx="42" cy="44" r="19" fill="#F2CC8F"/>
      <path d="M32 44h20M42 34v20" stroke="#12304A" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="88" fill="white" font-size="18" font-weight="700">MPU9250</text>
      <text x="24" y="111" fill="#C9D8E2" font-size="13">9-axis stream · 100 Hz</text>
    </g>
    <g transform="translate(285 120)">
      <rect width="190" height="135" rx="16" fill="white"/>
      <path d="M24 48h142" stroke="#D8E1E8" stroke-width="2"/>
      <path d="M24 55l18-20 18 31 18-27 18 8 18-23 18 40 18-22 18 10" fill="none" stroke="#177E89" stroke-width="4" stroke-linejoin="round"/>
      <text x="24" y="88" fill="#12304A" font-size="18" font-weight="700">Prepare signal</text>
      <text x="24" y="111" fill="#486579" font-size="13">50 Hz · 50-sample frame</text>
    </g>
    <g transform="translate(525 120)">
      <rect width="190" height="135" rx="16" fill="white"/>
      <g fill="#177E89">
        <rect x="24" y="29" width="11" height="34" rx="3"/><rect x="43" y="20" width="11" height="43" rx="3"/><rect x="62" y="37" width="11" height="26" rx="3"/><rect x="81" y="14" width="11" height="49" rx="3"/><rect x="100" y="31" width="11" height="32" rx="3"/><rect x="119" y="42" width="11" height="21" rx="3"/><rect x="138" y="25" width="11" height="38" rx="3"/>
      </g>
      <text x="24" y="88" fill="#12304A" font-size="18" font-weight="700">Extract features</text>
      <text x="24" y="111" fill="#486579" font-size="13">6 channels × 14 lags</text>
    </g>
    <g transform="translate(765 120)">
      <rect width="190" height="135" rx="16" fill="white"/>
      <path d="M28 56c25-35 48 25 73-5s43-26 65-8" fill="none" stroke="#E07A5F" stroke-width="4"/>
      <circle cx="62" cy="35" r="7" fill="#177E89"/><circle cx="92" cy="62" r="7" fill="#E07A5F"/><circle cx="129" cy="28" r="7" fill="#177E89"/>
      <text x="24" y="88" fill="#12304A" font-size="18" font-weight="700">RBF SVC</text>
      <text x="24" y="111" fill="#486579" font-size="13">C = 100 · γ = 0.01</text>
    </g>
    <g transform="translate(1005 112)">
      <rect width="150" height="66" rx="15" fill="#177E89"/>
      <text x="75" y="28" text-anchor="middle" fill="white" font-size="16" font-weight="700">8 activities</text>
      <text x="75" y="49" text-anchor="middle" fill="#DDF2F1" font-size="12">multiclass</text>
      <rect y="88" width="150" height="66" rx="15" fill="#E07A5F"/>
      <text x="75" y="116" text-anchor="middle" fill="white" font-size="16" font-weight="700">Fall / no fall</text>
      <text x="75" y="137" text-anchor="middle" fill="#FFF1ED" font-size="12">binary</text>
    </g>
  </g>
  <g stroke="#177E89" stroke-width="3" marker-end="url(#arrow)">
    <path d="M244 188h29"/><path d="M484 188h29"/><path d="M724 188h29"/><path d="M964 188h25"/>
  </g>
</svg>
